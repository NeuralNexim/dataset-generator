name: Project Governance

on:
    pull_request:
        branches: [ "main" ]

jobs:
    governance:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -e .[dev]

            # -----------------------------
            # 1. Branch naming enforcement
            # -----------------------------
            - name: Validate branch naming
              run: |
                  BRANCH="${GITHUB_HEAD_REF}"
                  if ! [[ "$BRANCH" =~ ^(feature|fix|docs)/ ]]; then
                    echo "❌ Branch name must start with feature/, fix/, or docs/"
                    exit 1
                  fi
                  echo "✔ Branch name OK: $BRANCH"

            # -----------------------------
            # 2. Commit message enforcement
            # -----------------------------
            - name: Validate commit message format
              run: |
                  MSG=$(git log -1 --pretty=%s)
                  if ! [[ "$MSG" =~ ^(feat|fix|docs|refactor|test)\(.+\): ]]; then
                    echo "❌ Commit message must follow conventional commits"
                    echo "Example: feat(curriculum): add reasoning depth control"
                    exit 1
                  fi
                  echo "✔ Commit message OK: $MSG"

            # -----------------------------
            # 3. TODO consistency checks
            # -----------------------------
            - name: Check TODO duplicates
              run: python scripts/check_todo_duplicates.py

            - name: Check README sync with TODO
              run: python scripts/check_readme_sync.py

            - name: Check task alignment (branch ↔ TODO ↔ commit)
              run: python scripts/check_task_alignment.py

            # -----------------------------
            # 4. Domain architecture checks
            # -----------------------------
            - name: Check domain registry consistency
              run: python scripts/check_domain_registry_consistency.py

            # -----------------------------
            # 5. CLI documentation checks
            # -----------------------------
            - name: Check CLI flags sync
              run: python scripts/check_cli_flags_sync.py

            # -----------------------------
            # 6. Versioning & changelog checks
            # -----------------------------
            - name: Check version bump
              run: python scripts/check_version_bump.py

            - name: Check changelog update
              run: python scripts/check_changelog_update.py

            # -----------------------------
            # 7. Auto-comment next TODO item
            # -----------------------------
            - name: Comment next TODO item
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const todo = fs.readFileSync('TODO.md', 'utf8');
                      const lines = todo.split('\n');
                      const next = lines.find(l => l.trim().startsWith('- [ ]'));
                      if (next) {
                        github.rest.issues.createComment({
                          issue_number: context.issue.number,
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          body: `🔜 **Next unchecked TODO item:**\n${next}`
                        });
                      }

            - name: Check PR size
              run: python scripts/check_pr_size.py

            - name: Check file permissions
              run: python scripts/check_file_permissions.py
